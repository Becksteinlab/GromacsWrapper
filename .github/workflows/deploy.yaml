name: Build and upload to PyPI

on:
  push:
    tags:
      - "*"
  release:
    types:
      - published

concurrency:
  group: "${{ github.ref }}-${{ github.head_ref }}-${{ github.workflow }}"
  cancel-in-progress: false

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package (wheel and sdist)
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Extract package version
        id: extract-version
        run: |
          WHEEL_FILE=$(ls dist/*.whl)
          VERSION=$(basename "$WHEEL_FILE" | sed -n 's/gromacswrapper-\([^-]*\)-.*/\1/p')
          if [ -z "$VERSION" ]; then
            python -m pip install --upgrade pip
            pip install "$WHEEL_FILE" --quiet
            VERSION=$(python -c "import gromacs; print(gromacs.__version__)")
            pip uninstall -y GromacsWrapper --quiet
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extracted version: $VERSION"

      - name: Upload dist files
        uses: actions/upload-artifact@v7
        with:
          name: dist-files
          path: dist/
          retention-days: 1

  test-install:
    name: Test package installation
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Download dist files
        uses: actions/download-artifact@v8
        with:
          name: dist-files
          path: dist/

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install dist/*.whl

      - name: Test import
        run: |
          python -c "import gromacs; print(f'Package {gromacs.__version__} imported successfully')"

  deploy-testpypi:
    name: Deploy to TestPyPI
    runs-on: ubuntu-latest
    needs: [build, test-install]
    if: |
      github.repository == 'Becksteinlab/GromacsWrapper' &&
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    environment:
      name: testpypi
      url: https://test.pypi.org/p/GromacsWrapper
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
    steps:
      - name: Download dist files
        uses: actions/download-artifact@v8
        with:
          name: dist-files
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          verbose: true

  deploy-pypi:
    name: Deploy to PyPI
    runs-on: ubuntu-latest
    needs: [build, test-install]
    if: |
      github.repository == 'Becksteinlab/GromacsWrapper' &&
      (github.event_name == 'release' && github.event.action == 'published')
    environment:
      name: pypi
      url: https://pypi.org/p/GromacsWrapper
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
    steps:
      - name: Download dist files
        uses: actions/download-artifact@v8
        with:
          name: dist-files
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3

  test-deployed-testpypi:
    name: Test deployed package (TestPyPI)
    runs-on: ubuntu-latest
    needs: [build, deploy-testpypi]
    if: |
      github.repository == 'Becksteinlab/GromacsWrapper' &&
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Checkout repository for actions
        uses: actions/checkout@v7

      - name: Wait for version to be available on TestPyPI
        uses: ./.github/actions/wait-for-pypi-version
        with:
          repository: testpypi
          package: GromacsWrapper
          version: ${{ needs.build.outputs.version }}

      - name: Install from TestPyPI
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ "GromacsWrapper==${{ needs.build.outputs.version }}"

      - name: Test import
        run: |
          cd ~
          python -c "import gromacs; print(f'Package {gromacs.__version__} imported successfully from TestPyPI')"

  test-deployed-pypi:
    name: Test deployed package (PyPI)
    runs-on: ubuntu-latest
    needs: [build, deploy-pypi]
    if: |
      github.repository == 'Becksteinlab/GromacsWrapper' &&
      (github.event_name == 'release' && github.event.action == 'published')
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Checkout repository for actions
        uses: actions/checkout@v7

      - name: Wait for version to be available on PyPI
        uses: ./.github/actions/wait-for-pypi-version
        with:
          repository: pypi
          package: GromacsWrapper
          version: ${{ needs.build.outputs.version }}

      - name: Install from PyPI
        run: |
          python -m pip install --upgrade pip
          pip install "GromacsWrapper==${{ needs.build.outputs.version }}"

      - name: Test import
        run: |
          cd ~
          python -c "import gromacs; print(f'Package {gromacs.__version__} imported successfully from PyPI')"
