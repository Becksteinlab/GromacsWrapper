# it is important to install gromacs together with everything else to ensure correct dependency resolution
name: gromacs_wrapper
channels:
- conda-forge
dependencies:
- matplotlib
- numkit>=1.0
- numpy>=1.0
- pandas>=0.17
- pocl
- setuptools
# older bioconda gromacs (e.g. 2018.6) needs libxml2.so.2 but does not always pull it in
- libxml2
# dev tools
- pytest
- pytest-cov
- coverage
- codecov
